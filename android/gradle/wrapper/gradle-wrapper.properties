distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# -bin, not the template's -all: the difference is Gradle's own sources
# and API docs, which nothing here reads, against ~80MB on the first
# build of every machine.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
# The template's 10s is a connect timeout, not a download budget, and it
# is too tight for the redirect to Gradle's CDN on a domestic line — the
# first build failed on it.
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
