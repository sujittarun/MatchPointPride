      name="description"
      content="Match Point Pride Badminton Academy, Hyderabad. Coaching, batches and membership led by Venu."

    <!-- The same mark as BrandMark.tsx, inline so a browser tab has an
         icon before a single request is made. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7.2' fill='%23C8FF4D'/%3E%3Cpath fill='%230B1004' d='M7.912 5.5 7.8 5A1.1 1.1 0 0 1 8.85 3.5h6.3A1.1 1.1 0 0 1 16.2 5l-.112.5ZM7.912 5.5h1.355l1.193 8.9H9.9ZM9.827 5.5h1.075l.398 8.9h-.28ZM11.462 5.5h1.076l-.398 8.9h-.28ZM13.098 5.5h1.075l-1.193 8.9h-.28ZM14.733 5.5h1.355l-1.988 8.9h-.56Z'/%3E%3Cpath fill='%230B1004' d='M10.2 14.1h3.6v4.6a1.8 1.8 0 0 1-3.6 0Z'/%3E%3C/svg%3E" />
      <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Without these, a home-screen icon on iOS is a plain Safari
         bookmark, and script-writable storage is cleared after 7 days
         of Safari use without opening the site. That would wipe the
         sealed session and send the owner back to his password. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pride" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
  </head>
